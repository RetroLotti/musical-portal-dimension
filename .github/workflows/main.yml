name: Publish Release
on:
  release:
    types: [published]
jobs:
  release:
    name: Release
    strategy:
      matrix:
        kind: ['linux', 'linux-arm', 'windows', 'macOS']
        include:
          # Linux 64-bit
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
          # Linux 32-bit
          - kind: linux
            os: ubuntu-latest
            target: linux-x86
          # Linux ARM 64-bit
          - kind: linux-arm
            os: ubuntu-latest
            target: linux-arm64
          # Linux ARM 32-bit
          - kind: linux-arm
            os: ubuntu-latest
            target: linux-arm
          # Windows 64-bit
          - kind: windows
            os: windows-latest
            target: win-x64
          # Windows 32-bit
          - kind: windows
            os: windows-latest
            target: win-x86
          # macOS 64-bit
          - kind: macOS
            os: macos-latest
            target: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build
        shell: bash
        run: |
          tag=$(git describe --tags --abbrev=0)
          release_name="MusicDimension-$tag-${{ matrix.target }}"
          # Build everything
          dotnet publish MusicDimension.csproj --framework net10.0 --runtime "${{ matrix.target }}" --configuration Release --output "$release_name" --self-contained true
          # Pack files
          if [ "${{ matrix.target }}" == "win-x64" ]; then
            # Pack to zip for Windows
            7z a -tzip "${release_name}.zip" "./${release_name}/*"
          else
            tar czvf "${release_name}.tgz" "$release_name"
          fi
          # Delete output directory
          rm -r "$release_name"
      - name: Publish .net
        uses: softprops/action-gh-release@v2
        with:
          files: "MusicDimension-*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
